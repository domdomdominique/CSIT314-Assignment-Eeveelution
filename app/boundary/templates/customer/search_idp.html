{% extends "base.html" %}
{% block content %}
<h1>Search design projects</h1>
<form method="get" role="search">
  <input name="q" value="{{ keyword }}" placeholder="Title or category">
  <button type="submit">Search</button>
</form>
<p>{{ results|length }} result(s)</p>
<table>
  <thead><tr><th>Title</th><th>Category</th><th>Views</th></tr></thead>
  <tbody>
  {% for idp in results %}
    <tr><td>{{ idp.title }}</td><td>{{ idp.category }}</td><td>{{ idp.view_count }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
